apply plugin: 'com.android.application'

android {
    namespace 'io.github.yor42.tbdriver'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.yor42.tbdriver'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.getByName('debug')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

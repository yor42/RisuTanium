name: Android APK build

# Manual only. Builds an APK and uploads it as a workflow artifact. It never creates a
# release: shipping an Android build is gated on the memory and performance work, and the
# debug build is the low-spec benchmark build. This repository is public, so anyone who can
# read it can download the artifact until it expires.
#
# Build types
#   debug    Signed with the runner's throwaway debug key, so it cannot update-install over an
#            APK built or signed elsewhere. Needs no secrets.
#   release: dispatch from main only. The shared workflow builds without a key, inspects, signs in
#            environment `android-release` (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; variable ANDROID_RELEASE_CERT_SHA256) and inspects again.
#            No repository-level copies. The key is never re-created for this app: another key cannot update
#            installed copies. Setup and checks: Agents/Tools/device/SIGNING.md. The signed artifact lasts 14 days.
#            After changing a variable or secret, confirm that no repository-level copy exists before "Re-run failed jobs", or use "Re-run all jobs", because a partial re-run does not repeat guard.
#
# The environment rule checks the ref a run starts from, not code that the run checks out later.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - debug
          - release
        default: debug
      abi:
        description: 'Target ABI'
        type: choice
        options:
          - aarch64
          - all
        default: aarch64

concurrency:
  group: android-build-${{ inputs.build_type }}
  cancel-in-progress: ${{ inputs.build_type == 'debug' }}

permissions:
  contents: read

# onnxruntime-node's install script downloads its CUDA binaries on Linux x64 when nvcc is absent.
# The build never uses the CUDA provider, and that download can fail, so the install skips it.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # Release builds run in the reusable workflow below; this job is the debug build.
  build-android:
    if: inputs.build_type == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The Android Gradle plugin and Gradle 8.14 need JDK 21 here; newer JDKs are not supported.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries the Android SDK and an NDK.
      - name: Point the build at the runner's Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.abi == 'all' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || 'aarch64-linux-android' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-${{ inputs.abi }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The legal flag comes from .env.production (on). Nothing here sets or overrides it.
      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          args=(android build --apk)
          if [ "$BUILD_TYPE" = "debug" ]; then
            args+=(--debug)
          fi
          if [ "$ABI" != "all" ]; then
            args+=(--target "$ABI")
          fi
          pnpm tauri "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: risutanium-android-${{ inputs.build_type }}-${{ inputs.abi }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  # Release builds: guard, build, inspect, sign, inspect again. The four secrets are passed by name and reach
  # only the sign job of the reusable workflow, inside environment android-release.
  release-apk:
    if: inputs.build_type == 'release'
    uses: ./.github/workflows/android-release-apk.yml
    with:
      abi: ${{ inputs.abi }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    permissions:
      contents: read
      actions: read

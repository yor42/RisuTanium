name: Desktop draft release

# Manual only. Builds every desktop target and attaches the installers to a DRAFT release
# named after the version in src-tauri/tauri.conf.json. Nothing is published until the
# draft is published by hand (which also creates the v* tag and so triggers docker-publish.yml).
#
# The installers are unsigned: no Apple or Windows signing secrets exist (MC-3231). Updates are
# signed: tauri.conf.json has createUpdaterArtifacts on, the fork's own Tauri updater (minisign)
# key comes from the TAURI_SIGNING_PRIVATE_KEY secrets, and tauri-action attaches the signed
# updater artifacts (.sig files) and a merged latest.json to the draft. Installed desktop builds
# check releases/latest/download/latest.json on boot, so they see a release only once it is published
# (not a draft, not a prerelease), and only if its tauri.conf.json version is higher.
#
# The releaseNotes input becomes the top of the release body, and tauri-action copies the body into
# latest.json's notes, which the in-app update popup shows. Editing the draft's body afterwards does not
# change latest.json. The web form takes one line; for several lines run
#   gh workflow run release-desktop.yml --repo yor42/RisuTanium -f releaseNotes="$(Get-Content -Raw notes.md)"
on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: Changes in this release (shown in the in-app update popup)
        type: string
        required: false
        default: ''

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

# onnxruntime-node's install script downloads its CUDA binaries on Linux x64 when nvcc is absent.
# The build never uses the CUDA provider, and that download can fail, so the install skips it.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build-desktop:
    name: Build ${{ matrix.settings.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest # Apple silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm # native arm64 runner
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm # native arm64 runner
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.settings.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux libraries
        if: startsWith(matrix.settings.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # ring compiles C for aarch64-pc-windows-msvc and needs clang there. Fail early if the
      # runner image has none instead of failing deep inside the cargo build.
      - name: Put clang on PATH (ring needs it for ARM64 Windows)
        if: matrix.settings.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = $null
          if (Test-Path $vswhere) {
            foreach ($pattern in @('**\Llvm\ARM64\bin\clang.exe', '**\Llvm\bin\clang.exe')) {
              $found = & $vswhere -latest -products * -find $pattern | Select-Object -First 1
              if ($found) { $clang = $found; break }
            }
          }
          if (-not $clang -and (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) { $clang = 'C:\Program Files\LLVM\bin\clang.exe' }
          if (-not $clang) { Write-Error 'clang.exe not found on this runner'; exit 1 }
          Split-Path $clang -Parent | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $clang --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.settings.platform }}-${{ matrix.settings.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The legal flag comes from .env.production (on). Nothing here sets or overrides it.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The build fails without the private key while createUpdaterArtifacts is on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ is replaced by the app version.
          tagName: v__VERSION__
          # The tag is created at the commit this run built, not at the default branch head.
          releaseCommitish: ${{ github.sha }}
          releaseName: v__VERSION__
          releaseBody: |
            ${{ inputs.releaseNotes }}

            Desktop builds of RisuTanium. The installers are unsigned; the update files are signed with the fork's own key. No release of this fork has been announced yet.

            - Windows: SmartScreen warns about an unknown publisher. Choose "More info", then "Run anyway".
            - macOS: the app is not signed or notarised. Right-click the app, choose Open, and confirm.
            - Linux: use the AppImage, deb or rpm for your architecture.

            Back up your data with Settings, Backup and Files before trying a build, and see the
            Migrating-from-upstream wiki page if you are coming from RisuAI.
          releaseDraft: true
          # Default true; stated because the updater depends on it. Each matrix job adds its
          # platform to the draft's latest.json.
          uploadUpdaterJson: true
          prerelease: false
          args: --target ${{ matrix.settings.target }}
          tauriScript: pnpm tauri

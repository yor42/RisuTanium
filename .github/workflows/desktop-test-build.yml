name: Desktop test build

# Manual only. Builds the five desktop targets and uploads the installers as workflow
# artifacts. No release or tag is created. The installers are unsigned. This repository is
# public, so anyone who can read it can download the artifacts until they expire.
on:
  workflow_dispatch: {}

concurrency:
  group: desktop-test-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest # Apple silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm # native arm64 runner
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux libraries
        if: startsWith(matrix.settings.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.settings.platform }}-${{ matrix.settings.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Without tagName or releaseId the action only builds. The legal flag comes from
      # .env.production (on); nothing here sets or overrides it.
      - uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.settings.target }}
          tauriScript: pnpm tauri

      # The .app bundle is a directory and is skipped; the dmg carries it.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: risutanium-${{ matrix.settings.target }}
          path: |
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

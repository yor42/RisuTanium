# Path to label for actions/labeler (.github/workflows/labeler.yml). Only paths that belong to one area are listed; every
# label already exists, and a label no rule matches is left to be set by hand. Labels are only added, never removed.
"area:settings":
  - changed-files:
      - any-glob-to-any-file:
          - src/lib/Setting/**
          - src/lib/SettingsShell/**
          - src/ts/setting/**
          - src/ts/settingsShell/**

"area:import-export":

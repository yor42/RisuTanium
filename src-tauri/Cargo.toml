[package]
name = "risuai"
version = "0.1.0"
description = "Risutanium (RisuTanium), a fork of RisuAI"
authors = ["yor42"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset", "devtools"] }
# A version floor only: tauri brings wry in, and Android plays a video from a file
# only from wry 0.57.1 on. No features are added here, so tauri's selection stands.
wry = { version = "0.57.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.4.0"
base64 = "0.21.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "http2", "system-proxy"] }
darling = "0.20.3"
futures = "0.3.30"
url = "2.2"
uuid = { version = "1.9.1", features = [ "v4" ] }
tauri-plugin-fs = "2.6.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-http = "2.8.0"
# Native avatar preview (avatar_preview module). Direct crates are pinned; the
# transitive inflate and rayon crates float until Cargo.lock is tracked.
png = "=0.18.1"
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent", "rayon"] }
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2.6.1"

# Desktop keeps reqwest's default TLS backend (platform-native); Android has no
# system OpenSSL to link, so it uses rustls.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["default-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "alib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-updater = "2.13.1"

[dev-dependencies]
# Test-only fixture producers and a one-thread pool for the peak measurement rows.
jpeg-encoder = "=0.7.1"
rayon = "=1.12.0"

# Test speed only: the decode rows run in the unoptimised test profile. The
# avatar preview relies on panic = "unwind" (catch_unwind around the decode body),
# so no profile in this file may set panic = "abort".
[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

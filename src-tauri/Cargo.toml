[package]
name = "risuai"
version = "0.1.0"
description = "Risutanium (RisuTanium), a fork of RisuAI"
authors = ["yor42"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset", "devtools"] }
serde_json = "1.0"
tiktoken-rs = "0.4.0"
base64 = "0.21.0"
reqwest = { version = "0.11.16", default-features = false, features = ["json"] }
darling = "0.20.3"
zip = "0.6.6"
tar = "0.4.40"
eventsource-client = "0.12.2"
futures = "0.3.30"
url = "2.2"
uuid = { version = "1.9.1", features = [ "v4" ] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-os = "2.2.1"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.3"
tauri-plugin-http = "2.5.5"
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2.4.6"

# Desktop keeps reqwest's default TLS backend (platform-native); Android has no
# system OpenSSL to link, so it uses rustls.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.11.16", default-features = false, features = ["default-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.11.16", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "alib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.2.3", features = ["deep-link"] }
tauri-plugin-updater = "2.9.0"

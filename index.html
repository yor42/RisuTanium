<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo_32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo_256.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="description" content="An AI frontend for both light and core users.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Decorative web fonts load without blocking script execution: a stalled request must not keep /src/main.ts from running. -->
    <link href="https://fonts.googleapis.com/css2?family=Tilt+Prism&family=Yellowtail&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Tilt+Prism&family=Yellowtail&display=swap" rel="stylesheet"></noscript>
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none'; require-trusted-types-for 'script'; trusted-types plugin-policy;"> -->
    <title>RisuTanium</title>
  </head>

  <body>
    <div id="app">
      <noscript>
        <div class="noscript">
          <h1>JavaScript is disabled</h1>
          <p>Please enable JavaScript to use this website.</p>
        </div>
      </noscript>
    </div>
    <!-- Loading screen, will be removed when /src/main.ts is loaded -->
    <div id="preloading" class="w-full h-full flex justify-center items-center text-textcolor text-xl bg-gray-900 flex-col absolute top-0 left-0 z-50">
      <div class="flex flex-row items-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-textcolor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span>Loading...</span>
      </div>
      <span class="text-sm mt-2 text-textcolor2">Loading RisuTanium...</span>
    </div>
    <script>
      // Watchdog: the loading screen is removed by /src/main.ts once the app has mounted. If it is still
      // present after the delay, boot is stalled; offer a manual reload instead of spinning forever.
      setTimeout(function () {
        var el = document.getElementById('preloading');
        if (!el || document.getElementById('preloading-stalled')) return;
        var box = document.createElement('div');
        box.id = 'preloading-stalled';
        box.style.cssText = 'margin-top:1rem;text-align:center;font-size:0.875rem';
        var msg = document.createElement('p');
        msg.textContent = 'Loading is taking longer than expected.';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Reload';
        btn.style.cssText = 'margin-top:0.5rem;padding:0.4rem 1.2rem;border:1px solid currentColor;border-radius:0.375rem;background:transparent;color:inherit;cursor:pointer';
        btn.onclick = function () { location.reload(); };
        box.appendChild(msg);
        box.appendChild(btn);
        el.appendChild(box);
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
